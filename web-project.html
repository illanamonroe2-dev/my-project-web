<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uji Coba GitHub Pages</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #0d0d11;
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-block;
      background: rgba(250, 35, 59, 0.2);
      color: #fa233b;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(250, 35, 59, 0.4);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    p {
      color: #8e8e93;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn {
      background: #fa233b;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .btn:hover {
      background: #e01e35;
      transform: translateY(-2px);
    }

    #counter-text {
      margin-top: 18px;
      font-size: 0.9rem;
      color: #34c759;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">TEST ENVIRONMENT</div>
    <h1>Web Test Server</h1>
    <p>Jika halaman ini muncul di browser, berarti proses deployment ke GitHub Pages kamu telah berhasil 100%!</p>
    
    <button class="btn" onclick="testClick()">Klik untuk Menguji JS</button>
    <div id="counter-text"></div>
  </div>

  <script>
    let count = 0;
    function testClick() {
      count++;
      document.getElementById('counter-text').innerText = `Tombol berhasil diklik ${count} kali!`;
    }
  </script>

</body>
</html>
